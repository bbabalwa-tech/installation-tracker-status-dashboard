<title>Stitch Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&family=Montserrat:wght@800&family=Pacifico&family=Great+Vibes&family=Playfair+Display:wght@700&family=Bebas+Neue&family=Fredoka:wght@600&family=Dancing+Script:wght@700&family=Oswald:wght@600&display=swap">
<style>
/* Layout: one-screen studio. Hoop canvas fills the screen; tools live in a bottom tab bar;
   each tool opens a sheet (bottom on phones, right-hand dock on wide screens). */
:root {
  --bg: #eef0ef; --surface: #ffffff; --surface-2: #f5f7f6; --ink: #17201e; --muted: #5d6a67;
  --line: #d5dcda; --accent: #0d6b62; --accent-ink: #ffffff; --brass: #b7791f;
  --good: #1f7a3a; --warn: #a35a00; --bad: #b42318; --canvas: #dfe4e2;
  --font-display: "Bricolage Grotesque", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tab-h: 62px; --head-h: 52px; --radius: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111615; --surface: #1a2120; --surface-2: #212a28; --ink: #e8eeec; --muted: #9aa8a5;
  --line: #2f3a38; --accent: #3fb8a8; --accent-ink: #062320; --brass: #e2a648;
  --good: #5cc77d; --warn: #f0a84a; --bad: #ff7b6e; --canvas: #0c100f; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111615; --surface: #1a2120; --surface-2: #212a28; --ink: #e8eeec; --muted: #9aa8a5;
  --line: #2f3a38; --accent: #3fb8a8; --accent-ink: #062320; --brass: #e2a648;
  --good: #5cc77d; --warn: #f0a84a; --bad: #ff7b6e; --canvas: #0c100f; color-scheme: dark }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; overflow: hidden; -webkit-tap-highlight-color: transparent; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: var(--head-h) 1fr auto; }
header.top { display: flex; align-items: center; gap: 8px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); background: var(--surface); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { font-family: var(--font-display); font-weight: 800; font-size: 18px; letter-spacing: -0.01em; white-space: nowrap; }
.brand b { color: var(--accent); font-weight: 800; }
.dname { flex: 1; min-width: 0; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 6px 8px; font-weight: 500; text-overflow: ellipsis; }
.dname:hover, .dname:focus { border-color: var(--line); background: var(--surface-2); }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); flex: none; }
.icon-btn:disabled { opacity: .4; cursor: default; }
.icon-btn svg, .tab svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.work { position: relative; min-height: 0; display: flex; }
.stage { position: relative; flex: 1; min-width: 0; background: var(--canvas); overflow: hidden; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.hud { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: none; }
.chip { pointer-events: auto; background: color-mix(in srgb, var(--surface) 92%, transparent); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px; font-size: 12.5px; font-family: var(--font-mono); white-space: nowrap; }
.chip.accent { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-family: var(--font-body); font-weight: 600; }
.zoombox { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; gap: 6px; }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 14px; border-radius: 10px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgb(0 0 0 / .2); z-index: 5; }
/* sheet */
.sheet { background: var(--surface); border-top: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; max-height: 46vh; }
.sheet[hidden] { display: none !important; }
.sheet-head { display: flex; align-items: center; gap: 8px; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 6px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { font-family: var(--font-display); font-size: 17px; font-weight: 800; margin: 0; flex: 1; }
.sheet-body { overflow-y: auto; padding: 4px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 900px) {
  .work { flex-direction: row; }
  .sheet { position: static; width: 390px; max-height: none; border-top: 0; border-left: 1px solid var(--line); }
  .app { grid-template-rows: var(--head-h) 1fr auto; }
}
.stack-sm .sheet { order: 2; }
.workcol { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
@media (max-width: 899px) { .work { flex-direction: column; } }
nav.tabs { display: grid; grid-template-columns: repeat(8, 1fr); background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { height: var(--tab-h); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: transparent; font-size: 10.5px; font-weight: 500; color: var(--muted); padding: 0 2px; min-width: 0; }
.tab span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.tab[aria-pressed="true"] { color: var(--accent); }
.tab[aria-pressed="true"] svg { stroke-width: 2.3; }
.tab.ai { color: var(--brass); }
/* controls */
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label, .lbl { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); line-height: 1.45; margin: 0; }
input[type=text], input[type=number], select, textarea { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; min-width: 0; width: 100%; }
textarea { resize: vertical; min-height: 64px; line-height: 1.4; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 999px; padding: 7px 12px; font-size: 13.5px; font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 10px 14px; font-weight: 600; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.brass { background: var(--brass); border-color: var(--brass); color: #1b1300; }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.wide { width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(30px, 1fr)); gap: 6px; }
.sw { aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--accent); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 10px; padding: 9px 11px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 16px; font-weight: 500; }
.stat small { color: var(--muted); font-size: 12px; }
.seq { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.seq li { display: flex; gap: 10px; align-items: center; font-size: 14px; }
.seq .dot { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); flex: none; }
.seq .n { font-family: var(--font-mono); color: var(--muted); width: 22px; }
.issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.issues li { font-size: 13.5px; line-height: 1.4; padding: 8px 10px 8px 12px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--muted); }
.issues li.good { border-color: var(--good); } .issues li.warn { border-color: var(--warn); } .issues li.bad { border-color: var(--bad); } .issues li.info { border-color: var(--accent); }
.layers { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.layers li button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border: 1px solid transparent; background: var(--surface-2); border-radius: 8px; padding: 7px 10px; font-size: 13.5px; }
.layers li button[aria-current="true"] { border-color: var(--accent); }
.layers .k { margin-left: auto; color: var(--muted); font-size: 12px; }
/* chat */
.chat { display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 10px 12px; border-radius: 12px; line-height: 1.5; font-size: 14.5px; max-width: 100%; overflow-wrap: anywhere; }
.msg.user { background: var(--accent); color: var(--accent-ink); align-self: flex-end; border-bottom-right-radius: 4px; max-width: 88%; }
.msg.ai { background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.ai p { margin: 0 0 6px; } .msg.ai p:last-child { margin-bottom: 0; }
.msg.ai ul { margin: 4px 0 6px; padding-left: 20px; }
.msg .acts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.msg .acts span { font-size: 11.5px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; color: var(--muted); }
.composer { display: flex; flex-direction: column; gap: 8px; position: sticky; bottom: 0; background: var(--surface); padding-top: 6px; }
.thumb { width: 64px; height: 64px; object-fit: contain; background: var(--surface-2); border-radius: 8px; border: 1px solid var(--line); }
.suggest { display: flex; gap: 6px; flex-wrap: wrap; }
.suggest button { border: 1px dashed var(--line); background: transparent; border-radius: 999px; padding: 6px 11px; font-size: 13px; color: var(--muted); text-align: left; }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 13px; color: var(--muted); line-height: 1.4; }
.check input { margin-top: 2px; flex: none; }
.mic.on { background: var(--bad); color: #fff; border-color: var(--bad); }
.preview-img { max-height: 160px; width: 100%; object-fit: contain; background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0/16px 16px; border-radius: 10px; border: 1px solid var(--line); }
.callout { background: color-mix(in srgb, var(--brass) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--brass) 40%, var(--line)); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; }
details summary { cursor: pointer; font-weight: 600; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">Stitch<b>Studio</b></div>
    <input class="dname" id="dname" type="text" aria-label="Design name" value="Untitled design">
    <button class="icon-btn" id="undo" title="Undo" aria-label="Undo"><svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
    <button class="icon-btn" id="redo" title="Redo" aria-label="Redo"><svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg></button>
    <button class="icon-btn" id="settingsBtn" title="Hoop and fabric" aria-label="Hoop and fabric settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="5.5"/><path d="M12 2v2.5M20 4l-2 2"/></svg></button>
  </header>
  <div class="work">
    <div class="workcol">
      <div class="stage" id="stage">
        <canvas id="cv"></canvas>
        <div class="hud" id="hud"></div>
        <div class="zoombox">
          <button class="icon-btn" id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M11 8v6M8 11h6M20 20l-4.5-4.5"/></svg></button>
          <button class="icon-btn" id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4.5-4.5"/></svg></button>
          <button class="icon-btn" id="zfit" aria-label="Fit hoop to screen"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
          <button class="icon-btn" id="zreal" aria-label="Show at real size" title="Real size"><svg viewBox="0 0 24 24"><path d="M3 8h18v8H3z"/><path d="M7 8v3M11 8v4M15 8v3M19 8v4"/></svg></button>
        </div>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>
    <section class="sheet" id="sheet" hidden aria-live="polite">
      <div class="sheet-head"><h2 id="sheetTitle">Tools</h2><button class="icon-btn" id="sheetClose" aria-label="Close panel"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="sheet-body" id="sheetBody"></div>
    </section>
  </div>
  <nav class="tabs" id="tabs" aria-label="Tools">
    <button class="tab" data-tool="select" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 2-2 6z"/></svg><span>Select</span></button>
    <button class="tab" data-tool="draw"><svg viewBox="0 0 24 24"><path d="M4 20c4-1 5-6 9-9s6-4 7-7"/><path d="M4 20h4"/></svg><span>Draw</span></button>
    <button class="tab" data-tool="shape"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="9" height="9" rx="1"/><circle cx="15.5" cy="15.5" r="5"/></svg><span>Shapes</span></button>
    <button class="tab" data-tool="text"><svg viewBox="0 0 24 24"><path d="M5 6V4h14v2M12 4v16M9 20h6"/></svg><span>Text</span></button>
    <button class="tab" data-tool="import"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg><span>Picture</span></button>
    <button class="tab ai" data-tool="ai"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2 2.2.8-2.2.8L19 21l-.8-2.2-2.2-.8 2.2-.8z"/></svg><span>Digitizer</span></button>
    <button class="tab" data-tool="stitch"><svg viewBox="0 0 24 24"><path d="M3 12h3M9 12h3M15 12h3"/><path d="M5 7l3 10M11 7l3 10M17 7l3 10"/></svg><span>Stitches</span></button>
    <button class="tab" data-tool="export"><svg viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="8" rx="1"/><path d="M8 10.5V20a1.5 1.5 0 0 0 1.5 1.5h5A1.5 1.5 0 0 0 16 20v-9.5M10 5.5h4"/></svg><span>Save</span></button>
  </nav>
</div>

<script>
/* Stitch Studio engine: geometry -> stitches -> Brother PES.
 * Units: millimetres, y grows downward, origin = top-left of the hoop's sewing field.
 * No DOM access in this file, so it runs in the browser and in Node tests. */
(function (root) {
  'use strict';
  const E = {};

  // ---------------------------------------------------------------- machine + materials
  E.HOOPS = {
    '5x7': { label: '5" × 7" (130 × 180 mm)', w: 130, h: 180 },
    '4x4': { label: '4" × 4" (100 × 100 mm)', w: 100, h: 100 },
    '2x6': { label: 'Small 2 × 6 cm', w: 20, h: 60 },
  };

  // Settings an experienced digitizer would pick per fabric.
  // spacing = row spacing (density) in mm, pull = pull compensation per side in mm.
  E.FABRICS = {
    woven:  { label: 'Woven cotton / tote', spacing: 0.42, pull: 0.25, underlay: 'normal', ulSpacing: 2.2, satinSpacing: 0.40,
              stabilizer: 'Medium tear-away. Use cut-away if the item will be washed often or worn.', topping: false },
    knit:   { label: 'T-shirt / stretch knit', spacing: 0.45, pull: 0.35, underlay: 'heavy', ulSpacing: 1.8, satinSpacing: 0.42,
              stabilizer: 'No-show mesh cut-away, fused to the back. Never tear-away on knits.', topping: false },
    fleece: { label: 'Sweatshirt / fleece / hoodie', spacing: 0.43, pull: 0.40, underlay: 'heavy', ulSpacing: 1.8, satinSpacing: 0.40,
              stabilizer: 'Medium cut-away on the back plus water-soluble topping on the front.', topping: true },
    towel:  { label: 'Towel / terry / minky', spacing: 0.40, pull: 0.40, underlay: 'heavy', ulSpacing: 1.6, satinSpacing: 0.38,
              stabilizer: 'Tear-away (or cut-away) on the back. Water-soluble topping on the front is essential.', topping: true },
    denim:  { label: 'Denim / canvas / twill', spacing: 0.42, pull: 0.20, underlay: 'normal', ulSpacing: 2.4, satinSpacing: 0.40,
              stabilizer: 'Medium tear-away.', topping: false },
    felt:   { label: 'Felt / patches', spacing: 0.45, pull: 0.20, underlay: 'light', ulSpacing: 2.6, satinSpacing: 0.42,
              stabilizer: 'Tear-away, or two layers of water-soluble for free-standing patches.', topping: false },
    vinyl:  { label: 'Vinyl / faux leather', spacing: 0.55, pull: 0.15, underlay: 'light', ulSpacing: 3.0, satinSpacing: 0.50,
              stabilizer: 'Tear-away. Never use a heavy fill: each needle hole is permanent.', topping: false },
  };

  E.SATIN_MAX = 7.0;      // longest single satin stitch before it is split
  E.STITCH_LEN = 3.5;     // tatami stitch length
  E.RUN_LEN = 2.5;        // running stitch length
  E.MIN_STITCH = 0.6;     // shorter stitches are merged (thread breaks / bird nests)
  E.JUMP_STITCH = 2.0;    // connect directly up to this distance, otherwise trim
  E.SPM = 650;            // realistic speed for the NV880E on dense designs

  // Brother's 64-colour PEC thread chart (what the machine screen shows).
  E.BROTHER = [[14,31,124,'Prussian Blue'],[10,85,163,'Blue'],[0,135,119,'Teal Green'],[75,107,175,'Cornflower Blue'],[237,23,31,'Red'],[209,92,0,'Reddish Brown'],[145,54,151,'Magenta'],[228,154,203,'Light Lilac'],[145,95,172,'Lilac'],[158,214,125,'Mint Green'],[232,169,0,'Deep Gold'],[254,186,53,'Orange'],[255,255,0,'Yellow'],[112,188,31,'Lime Green'],[186,152,0,'Brass'],[168,168,168,'Silver'],[125,111,0,'Russet Brown'],[255,255,179,'Cream Brown'],[79,85,86,'Pewter'],[0,0,0,'Black'],[11,61,145,'Ultramarine'],[119,1,118,'Royal Purple'],[41,49,51,'Dark Gray'],[42,19,1,'Dark Brown'],[246,74,138,'Deep Rose'],[178,118,36,'Light Brown'],[252,187,197,'Salmon Pink'],[254,55,15,'Vermilion'],[240,240,240,'White'],[106,28,138,'Violet'],[168,221,196,'Seacrest'],[37,132,187,'Sky Blue'],[254,179,67,'Pumpkin'],[255,243,107,'Cream Yellow'],[208,166,96,'Khaki'],[209,84,0,'Clay Brown'],[102,186,73,'Leaf Green'],[19,74,70,'Peacock Blue'],[135,135,135,'Gray'],[216,204,198,'Warm Gray'],[67,86,7,'Dark Olive'],[253,217,222,'Flesh Pink'],[249,147,188,'Pink'],[0,56,34,'Deep Green'],[178,175,212,'Lavender'],[104,106,176,'Wisteria Violet'],[239,227,185,'Beige'],[247,56,102,'Carmine'],[181,75,100,'Amber Red'],[19,43,26,'Olive Green'],[199,1,86,'Dark Fuchsia'],[254,158,50,'Tangerine'],[168,222,235,'Light Blue'],[0,103,62,'Emerald Green'],[78,41,144,'Purple'],[47,126,32,'Moss Green'],[255,204,204,'Flesh Pink'],[255,217,17,'Harvest Gold'],[9,91,166,'Electric Blue'],[240,249,112,'Lemon Yellow'],[227,243,91,'Fresh Green'],[255,153,0,'Orange'],[255,240,141,'Cream Yellow'],[255,200,200,'Applique']];

  function hexToRgb(h) {
    h = String(h || '#000').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h, 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgbToHex(c) { return '#' + c.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
  function redMean(a, b) {
    const rm = Math.round((a[0] + b[0]) / 2), r = a[0] - b[0], g = a[1] - b[1], bl = a[2] - b[2];
    return (((512 + rm) * r * r) >> 8) + 4 * g * g + (((767 - rm) * bl * bl) >> 8);
  }
  // index into a 65-entry chart (0 = unknown); entries may be null
  function nearestIndex(rgb, chart) {
    let best = null, bd = Infinity;

const RULES = `You are the digitizer inside Stitch Studio, an embroidery app for a Brother NV880E single-needle machine (max field 130 × 180 mm, PES files). You have 20+ years of professional machine-embroidery digitizing experience. The person using you is a hobbyist who wants premium results without learning digitizing.

HOW YOU WORK
- You change the design ONLY through the tools. Call get_design first if you need to know what is on the hoop.
- Coordinates are millimetres. Origin (0,0) is the top-left of the sewing field, x grows right, y grows DOWN. The field size comes from get_design (hoop.w × hoop.h). Keep everything at least 3 mm inside the edges.
- Objects stitch in array order: background first, details and outlines last. The app sews same-colour neighbours together automatically.
- Shapes are SVG path data in mm, ABSOLUTE commands only (M L H V C Q Z). Fill shapes must be closed. Holes = extra subpaths inside (even-odd rule).
- Draw like a professional digitizer, not an illustrator: bold simple shapes, smooth curves (use C/Q curves, not jagged polygons), no gradients, no shading, no hairlines, at most 6 thread colours, and use real thread-like colours.

STITCH TYPES (choose like an expert)
- "fill" (tatami): any area wider than about 7 mm. Narrow parts of a fill automatically sew as satin. Set "angle" (degrees, 0 = horizontal) so neighbouring areas differ by 45-90°; follow the natural grain (petals radiate, leaves along the vein).
- "satin": columns/borders/stems 1.2-7 mm wide. Give the centre line as an open path and "width" in mm. Never narrower than 1.2 mm.
- "run": details under 1.2 mm, outlines, faces, quilting lines. Set "triple": true for bold, visible lines (redwork, outlines on top of fills).
- "text": lettering. Give text, font (block | tall | varsity | rounded | serif | script | brush | elegant), heightMm (capital height), x and y (centre), optional arc in degrees (positive = rainbow arch, negative = smile). Minimum heightMm 6 for block fonts, 10 for script fonts. Use "style": "run" only for tiny outline text.
- "applique": a closed shape that becomes placement line, tack-down, and satin cover with machine stops. Great for big areas on a single-needle machine (saves thousands of stitches).

QUALITY RULES YOU ALWAYS APPLY
- Nothing smaller than 1.5 mm across unless it is a run line. Merge tiny details or leave them out.
- Overlap touching colour areas by about 0.5 mm so no fabric shows between them (draw the lower shape slightly bigger, under the upper one).
- Big filled designs on knits or towels: suggest appliqué or lighter coverage. Recommend stabilizer, topping and needle when relevant.
- After building or editing a design, call get_stitch_report and fix anything it flags before you finish.
- For a picture the person attached: if it is a clean logo or flat artwork, call trace_image (exact colours, best fidelity). If it is a photo, sketch, or busy image, redraw it as clean embroidery shapes yourself with add_objects, keeping the recognisable essentials.

TALKING
- Short, warm and plain, like an expert friend at the machine. No jargon without a quick explanation. After a change, say what you did in 1-3 sentences and give one practical stitching tip (stabilizer, thread, hooping) when it helps. Ask a question only when you truly cannot decide (for example the size they need).`;

}

let chatCtl = null;
async function sendChat(text) {
  text = text.trim(); if (!text && !S.chatImage) return;
  if (!sample) { toast('The AI digitizer works when this app is opened inside Claude.'); return; }
  const image = S.chatImage; S.chatImage = null;
  const userText = text || 'Turn this picture into an embroidery design.';
  S.chat.push({ role: 'user', content: userText + (image ? '\n[The person attached a picture.]' : ''), image: image ? image.toDataURL('image/jpeg', 0.6) : null });
  const aiMsg = { role: 'assistant', content: '', acts: [], pending: true }; S.chat.push(aiMsg);
  refreshPanel(); scrollChat();
  chatCtl = new AbortController();
  const turns = [{ role: 'user', content: RULES + '\n\nCurrent design (JSON): ' + JSON.stringify(designSummary()).slice(0, 12000) }];
  S.chat.slice(-13, -1).forEach(m => turns.push({ role: m.role, content: m.content || '(no reply)' }));
  const opts = { tools: buildTools(aiMsg.acts, image), signal: chatCtl.signal, cache: false, modelTier: S.expert ? 'complex' : 'default',
    onText: ({ text }) => { aiMsg.content = text; renderChatMsgs(); } };
  if (image) { try { opts.images = [await new Promise(r => downscale(image, 1568).toBlob(r, 'image/png'))]; } catch (e) {} }
  try {
    const res = await sample(turns, opts);
    aiMsg.content = res.text; if (res.truncated) aiMsg.content += '\n\n(That answer was cut short. Ask me to continue.)';
  } catch (e) {
    aiMsg.content = (e && e.text) || '';
    const msgs = { not_granted: 'The digitizer needs your permission to use Claude. Tap send again and choose Allow.', rate_limited: 'Claude is busy for a moment. Wait a few seconds and send again.', cancelled: aiMsg.content ? '' : 'Stopped.', images_unavailable: 'Pictures cannot be sent to Claude from this view. Use the Picture tab to auto-digitize it instead.', prompt_too_large: 'The design is too big to describe in one message. Remove some objects or start a new chat.' };
    const extra = msgs[e && e.code] != null ? msgs[e.code] : 'Something went wrong talking to Claude (' + ((e && e.code) || 'error') + '). Try again.';
    if (extra) aiMsg.content += (aiMsg.content ? '\n\n' : '') + extra;
    if (e && e.code === 'not_granted') { /* keep the feature visible; the viewer may allow next time */ }
  } finally { aiMsg.pending = false; chatCtl = null; refreshPanel(); scrollChat(); }
}
function scrollChat() { const b = $('#sheetBody'); if (b) requestAnimationFrame(() => { b.scrollTop = b.scrollHeight; }); }
function mdLite(t) {
  const lines = esc(t).split('\n'); let html = '', inList = false;
  for (const l of lines) {
    const m = l.match(/^\s*(?:[-*•]|\d+\.)\s+(.*)/);
    if (m) { if (!inList) { html += '<ul>'; inList = true; } html += '<li>' + inline(m[1]) + '</li>'; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    if (l.trim()) html += '<p>' + inline(l) + '</p>';
  }
  if (inList) html += '</ul>';
  return html;
  function inline(s) { return s.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>'); }
}

async function savePES() {
  if (!S.design.objects.length) { toast('Add something to the hoop first.'); return; }
  const r = ensureResult();
  const issues = E.qualityReport(designForEngine(), r);
  if (issues.some(i => i.level === 'bad')) { toast(issues.find(i => i.level === 'bad').text); return; }
  const bytes = E.writePES(r, { name: S.design.name, rotate: S.design.landscape });
  const filename = (S.design.name.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '_') || 'design') + '.pes';
  if (downloads) {
    try { const res = await downloads.save({ filename, data: bytes }); if (res.status === 'saved') toast('Saved ' + filename + '. Copy it to a USB stick for your NV880E.'); return; }
    catch (e) {
      if (e && e.code === 'declined') return;
      if (e && e.code !== 'unavailable') { toast('The file could not be saved (' + e.code + ').'); return; }
    }
  }
  const blob = new Blob([bytes], { type: 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast('Saved ' + filename);
}
function saveToLibrary() {
  const lib = store.get('stitchstudio.library', []);
  const entry = { id: Date.now().toString(36), name: S.design.name, at: Date.now(), design: compact(S.design) };
  const i = lib.findIndex(x => x.name === entry.name); if (i >= 0) lib[i] = entry; else lib.unshift(entry);
  if (store.set('stitchstudio.library', lib.slice(0, 40))) toast('Saved “' + entry.name + '” to My designs'); else toast('Storage is full. Delete an old design, or save the PES file instead.');
  refreshPanel();
}

      ${!sample ? `<div class="callout">The AI digitizer runs on your Claude account, so it works when Stitch Studio is opened inside Claude (claude.ai or the Claude app). Everything else in the app works anywhere.</div>` : ''}
      ${empty ? `<p class="hint">Describe what you want, like you would to a professional digitizer. Mention the size, the fabric, and the colours if you know them. Attach inspiration pictures too.</p>
      <div class="suggest">${['A 3 inch sunflower with “Mia” in script underneath, for a cotton tote', 'A simple bold mountain logo with the word ADVENTURE, 4 inches wide, for a hoodie', 'Monogram the letters J&amp;K in an elegant script inside an oval frame for a towel', 'Check my design and fix anything that will stitch badly'].map(s => `<button data-s="${s}">${s}</button>`).join('')}</div>` : ''}
      <div class="chat" id="chatList"></div>
      <div class="composer">
        ${S.chatImage ? `<div class="row"><img class="thumb" alt="Attached picture" src="${S.chatImage.toDataURL('image/jpeg', 0.5)}"><button class="btn" id="unattach">Remove picture</button></div>` : ''}
        <textarea id="chatIn" rows="2" placeholder="Describe your design or ask anything about embroidery…">${esc(S.chatDraft || '')}</textarea>
        <div class="row">
          ${dictation ? `<button class="btn mic" id="mic" aria-label="Speak">🎙 Speak</button>` : ''}
          <label class="btn" for="chatFile">Attach picture</label><input type="file" id="chatFile" accept="image/*,application/pdf,.pdf" hidden>
          <span style="flex:1"></span>
          ${chatCtl ? '<button class="btn" id="stopAi">Stop</button>' : `<button class="btn primary" id="sendAi" ${sample ? '' : 'disabled'}>Send</button>`}
        </div>
        ${!dictation ? '<p class="hint">To talk instead of typing, tap the microphone on your phone keyboard.</p>' : ''}
        <label class="check"><input type="checkbox" id="expert" ${S.expert ? 'checked' : ''}> Expert mode: slower, but the most careful digitizing</label>
      </div>`,
      () => {
        renderChatMsgs();
        const ta = $('#chatIn'); ta.oninput = () => { S.chatDraft = ta.value; };
        ta.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); go(); } };
        const go = () => { const v = ta.value; S.chatDraft = ''; ta.value = ''; sendChat(v); };
        const sb = $('#sendAi'); if (sb) sb.onclick = go;
        const st = $('#stopAi'); if (st) st.onclick = () => chatCtl && chatCtl.abort();
        body.querySelectorAll('.suggest button').forEach(b => b.onclick = () => { ta.value = b.textContent; S.chatDraft = ta.value; ta.focus(); });
        $('#expert').onchange = e => { S.expert = e.target.checked; };
        $('#chatFile').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { S.chatImage = await loadPicture(f); refreshPanel(); } catch (err) { toast(err.message); } };
        const un = $('#unattach'); if (un) un.onclick = () => { S.chatImage = null; refreshPanel(); };
        const mic = $('#mic');
        if (mic && dictation) {
          mic.onclick = () => {
            if (S.listening) { dictation.stop().catch(() => {}); return; }
            const base = ta.value ? ta.value.replace(/\s*$/, ' ') : '';
            let finals = '';
            dictation.onPartial(({ text }) => { ta.value = base + finals + text; });
            dictation.onFinal(({ text }) => { finals += text + ' '; ta.value = base + finals; S.chatDraft = ta.value; });
            dictation.onState(({ state }) => { S.listening = state === 'listening'; mic.classList.toggle('on', S.listening); mic.textContent = S.listening ? '■ Stop' : '🎙 Speak'; });
            dictation.start().catch(err => { if (err && err.code === 'not_granted') { toast('Microphone not allowed. Use your keyboard microphone instead.'); mic.hidden = true; } });
          };
        }
      }];
  },
  stitch() {
    const r = ensureResult(), s = r.stats; const N = r.stitches.length;
    const issues = E.qualityReport(designForEngine(), r);
    const F = E.FABRICS[S.design.fabric];
    return ['Stitch-out preview', `
      <div class="stats">
        <div class="stat"><b>${s.stitchCount.toLocaleString()}</b><small>stitches</small></div>
        <div class="stat"><b>${s.bounds ? s.bounds.w.toFixed(1) + ' × ' + s.bounds.h.toFixed(1) : '0'}</b><small>mm (${s.bounds ? (s.bounds.w / 25.4).toFixed(2) + '" × ' + (s.bounds.h / 25.4).toFixed(2) + '"' : ''})</small></div>
        <div class="stat"><b>${Math.max(0, Math.round(s.minutes))} min</b><small>about, sewing time</small></div>
        <div class="stat"><b>${s.colorCount} · ${s.trims}</b><small>thread stops · trims</small></div>
      </div>
      <div class="field"><span class="lbl">Watch it sew</span>
        <div class="row"><button class="btn" id="play">${S.playing ? 'Pause' : 'Play'}</button><input type="range" id="scrub" min="0" max="${N}" value="${S.player == null ? N : S.player}" style="flex:1" aria-label="Stitch position"></div></div>
      <div class="field"><span class="lbl">Quality check</span><ul class="issues">${issues.map(i => `<li class="${i.level}">${esc(i.text)}</li>`).join('')}</ul></div>
      <div class="field"><span class="lbl">Thread order for your NV880E</span><ol class="seq">${r.colors.map((c, i) => { const b = E.brotherFor(c.color); return `<li><span class="n">${i + 1}</span><span class="dot" style="background:${b.hex}"></span><span><b>${esc(b.name)}</b>${c.label ? ' · <span class="hint">' + esc(c.label) + '</span>' : ''}</span></li>`; }).join('')}</ol></div>
      <div class="callout"><b>${esc(F.label)}:</b> ${esc(F.stabilizer)}${F.topping ? ' Topping keeps stitches from sinking into the pile.' : ''} Use a 75/11 embroidery needle and 40 wt thread.</div>`,
      () => {
        const sc = $('#scrub'); sc.oninput = () => { S.player = +sc.value; S.playing = false; draw(); };
        $('#play').onclick = () => { S.playing = !S.playing; if (S.playing && (S.player == null || S.player >= N)) S.player = 0; $('#play').textContent = S.playing ? 'Pause' : 'Play'; if (S.playing) tick(); };
        function tick() { if (!S.playing || panel !== 'stitch') return; S.player = Math.min(N, S.player + Math.max(8, Math.round(N / 600))); const el = $('#scrub'); if (el) el.value = S.player; draw(); if (S.player >= N) { S.playing = false; S.player = null; refreshPanel(); return; } requestAnimationFrame(tick); }
      }];
  },
  export() {
    const lib = store.get('stitchstudio.library', []);
    return ['Save', `
      <button class="btn primary wide" id="xpes">Save .PES file for my machine</button>
      <p class="hint">Copy the .pes file to a USB stick, plug it into the NV880E's USB port, and choose it from the embroidery screen. ${S.design.landscape ? 'This design is laid out sideways and is turned upright in the file to fit the 5×7 hoop.' : ''}</p>
      <button class="btn wide" id="xlib">Save to My designs</button>
      <div class="field"><span class="lbl">My designs (on this device)</span>
      ${lib.length ? `<ul class="layers">${lib.map(e => `<li class="row" style="flex-wrap:nowrap"><button data-load="${e.id}" style="flex:1">${esc(e.name)}<span class="k">${new Date(e.at).toLocaleDateString()}</span></button><button class="icon-btn" data-del="${e.id}" aria-label="Delete ${esc(e.name)}"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/></svg></button></li>`).join('')}</ul>` : '<p class="hint">Nothing saved yet.</p>'}</div>`,
      () => {
        $('#xpes').onclick = savePES; $('#xlib').onclick = saveToLibrary;
        body.querySelectorAll('[data-load]').forEach(b => b.onclick = () => { const e = lib.find(x => x.id === b.dataset.load); if (!e) return; commit(); S.design = JSON.parse(JSON.stringify(e.design)); S.sel = null; afterLoad(); fit(); toast('Opened “' + e.name + '”'); });
        body.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.style.color = 'var(--bad)'; toast('Tap the bin again to delete.'); return; } store.set('stitchstudio.library', lib.filter(x => x.id !== b.dataset.del)); refreshPanel(); });
      }];
  },
  settings() {
    const d = S.design; const b = designBox();
    return ['Hoop & fabric', `
      <div class="field"><span class="lbl">Hoop</span>${seg('shoop', Object.entries(E.HOOPS).map(([k, h]) => [k, h.label]), d.hoop)}</div>
      <div class="field"><span class="lbl">Layout</span>${seg('sland', [['0', 'Upright'], ['1', 'Sideways']], d.landscape ? '1' : '0')}</div>
      <div class="field"><label for="sfab">Fabric</label><select id="sfab">${Object.entries(E.FABRICS).map(([k, f]) => `<option value="${k}" ${k === d.fabric ? 'selected' : ''}>${f.label}</option>`).join('')}</select>
        <p class="hint">Density, underlay and pull compensation adjust to the fabric automatically.</p></div>
      <div class="field"><label for="sfc">Fabric colour (for the preview)</label><input type="color" id="sfc" value="${d.fabricColor}"></div>
      ${b ? `<div class="field"><span class="lbl">Whole design: <span class="mono">${b.w.toFixed(1)} × ${b.h.toFixed(1)} mm</span></span>
        <div class="grid2"><div class="field"><label for="dw2">Width mm</label><input type="number" id="dw2" step="1" value="${b.w.toFixed(1)}"></div><div class="field"><label for="dh2">Height mm</label><input type="number" id="dh2" step="1" value="${b.h.toFixed(1)}"></div></div>
        <div class="row"><button class="btn" id="dctr">Centre in hoop</button><button class="btn" id="dfit">Fill the hoop</button></div>
        <p class="hint">Resizing rebuilds every stitch at the new size, so density stays correct.</p></div>` : ''}
      <div class="field"><span class="lbl">Rulers</span>${seg('sunit', [['mm', 'Millimetres'], ['in', 'Inches']], store.get('stitchstudio.units', 'mm'))}</div>
      <label class="check"><input type="checkbox" id="sopt" ${d.optimize !== false ? 'checked' : ''}> Group same-colour pieces to save thread changes</label>`,
      () => {
        const upd = fn => { commit(); fn(); changed(); };
        bindSeg('shoop', v => { upd(() => { d.hoop = v; }); fit(); });
        bindSeg('sland', v => { upd(() => { d.landscape = v === '1'; }); fit(); });
        $('#sfab').onchange = e => upd(() => { d.fabric = e.target.value; });
        $('#sfc').onchange = e => upd(() => { d.fabricColor = e.target.value; });
        const w = $('#dw2'); if (w) { w.onchange = () => upd(() => resizeDesign(+w.value, null)); $('#dh2').onchange = e => upd(() => resizeDesign(null, +e.target.value)); $('#dctr').onclick = () => upd(() => resizeDesign(null, null)); $('#dfit').onclick = () => upd(() => { const h = hoopDims(), bb = designBox(); const k = Math.min((h.w - 8) / bb.w, (h.h - 8) / bb.h); resizeDesign(bb.w * k, null); }); }
        bindSeg('sunit', v => { store.set('stitchstudio.units', v); refreshPanel(); draw(); });
        $('#sopt').onchange = e => upd(() => { d.optimize = e.target.checked; });
      }];
  },
};
function kindLabel(o) { return { fill: 'Fill', satin: 'Satin', run: o.triple ? 'Bold run' : 'Running', applique: 'Appliqué' }[o.kind] || o.kind; }
function renderChatMsgs() {
  const list = $('#chatList'); if (!list) return;
  list.innerHTML = S.chat.map(m => m.role === 'user'
    ? `<div class="msg user">${m.image ? `<img class="thumb" alt="" src="${m.image}" style="display:block;margin-bottom:6px">` : ''}${esc(m.content.replace(/\n\[The person attached a picture\.\]$/, ''))}</div>`
    : `<div class="msg ai">${m.content ? mdLite(m.content) : (m.pending ? '<p class="hint">Thinking like a digitizer…</p>' : '')}${m.acts && m.acts.length ? `<div class="acts">${m.acts.map(a => `<span>${esc(a)}</span>`).join('')}</div>` : ''}</div>`).join('');
}

// ------------------------------------------------------------ hud, toast, misc
function updateHud() {
  const h = hoopDims(); const b = designBox();
  const parts = [`<span class="chip">${esc(S.design.hoop.replace('x', '×'))} hoop · ${esc(E.FABRICS[S.design.fabric].label.split(' /')[0])}</span>`];
  if (b) parts.push(`<span class="chip">${b.w.toFixed(1)} × ${b.h.toFixed(1)} mm</span>`);
  if (S.tool === 'measure') parts.push('<span class="chip accent">Measuring</span>');
  if (S.stitchView) parts.push('<span class="chip accent">Stitch view</span>');
  $('#hud').innerHTML = parts.join('');
}
let toastT = 0;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3800); }
$('#undo').onclick = undo; $('#redo').onclick = redo;
$('#zin').onclick = () => zoomAt(1.3, CW / 2, CH / 2); $('#zout').onclick = () => zoomAt(1 / 1.3, CW / 2, CH / 2); $('#zfit').onclick = fit; $('#zreal').onclick = realSize;
$('#dname').onchange = e => { commit(); S.design.name = e.target.value.trim() || 'Untitled design'; changed(); };
document.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea,select')) return;
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  if ((e.key === 'Delete' || e.key === 'Backspace') && S.sel) { commit(); S.design.objects = S.design.objects.filter(o => o.id !== S.sel); S.sel = null; changed(); }
});
new ResizeObserver(() => { resize(); if (S.autoFit) fit(); }).observe($('#stage'));

// ------------------------------------------------------------ boot
async function exampleDesign() {
  const d = S.design; d.name = 'Example: sunflower tote'; $('#dname').value = d.name;
  const h = hoopDims(), cx = h.w / 2, cy = 70;
  const petals = [];
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; const pts = []; for (let k = 0; k <= 24; k++) { const t = k / 24 * Math.PI; const r = 34 * Math.sin(t) ** 0.8, w = 7.5 * Math.sin(t); const along = 12 + 24 * (k / 24); pts.push([along, w * (k < 12 ? 1 : 1)]); } const ring = pts.map(p => p).concat(pts.slice(1, -1).reverse().map(p => [p[0], -p[1]])); petals.push(ring.map(p => [cx + p[0] * Math.cos(a) - p[1] * Math.sin(a), cy + p[0] * Math.sin(a) + p[1] * Math.cos(a)])); }
  addObject({ kind: 'fill', color: '#feba35', rings: petals.slice(0, 6), angle: 60, name: 'Petals A' }, false);
  addObject({ kind: 'fill', color: '#e89a00', rings: petals.slice(6), angle: 120, name: 'Petals B' }, false);
  // reorder petals: alternate so neighbours differ
  S.design.objects[0].rings = petals.filter((_, i) => i % 2 === 0); S.design.objects[1].rings = petals.filter((_, i) => i % 2 === 1);
  addObject({ kind: 'fill', color: '#5a3a1a', rings: E.shapes.ellipse(cx, cy, 14.5, 14.5), angle: 30, name: 'Centre' }, false);
  addObject({ kind: 'run', color: '#2a1300', triple: true, paths: [E.shapes.ellipse(cx, cy, 10, 10)[0].concat([E.shapes.ellipse(cx, cy, 10, 10)[0][0]])], name: 'Centre ring' }, false);
  addObject({ kind: 'satin', color: '#2f7e20', width: 2.6, paths: [E.smoothPath([[cx, cy + 36], [cx + 2, cy + 52], [cx - 1, cy + 70]], 3)], name: 'Stem' }, false);
  addObject({ kind: 'fill', color: '#2f7e20', rings: [E.smoothPath([[cx + 1, cy + 56], [cx + 12, cy + 47], [cx + 24, cy + 49], [cx + 12, cy + 57], [cx + 1, cy + 56]], 3)], angle: 150, name: 'Leaf' }, false);
  try { await addText({ text: 'Mia', font: 'script', heightMm: 22, x: cx, y: 160, color: '#134a46' }, false); } catch (e) {}
  S.sel = null; S.hist = []; updateUndo();
}
async function boot() {
  resize(); fit();
  const saved = store.get('stitchstudio.current', null);
  if (saved && saved.objects) { S.design = Object.assign(S.design, saved); $('#dname').value = S.design.name; }
  else await exampleDesign();
  S.result = null; draw(); updateHud(); fit();
  setTool('select');
  if (!saved) toast('This is an example design. Tap New design under Select to start fresh.');
}
boot();
})();
</script>
